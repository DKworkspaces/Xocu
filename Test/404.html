<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    
    <!-- PURE HTML REDIRECT: Sends user to homepage after 8 seconds -->
    <meta http-equiv="refresh" content="8; url=index.html">
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 10% 5%;
            background-color: #fcfcfc;
            color: #222;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { font-size: 4rem; margin: 0; color: #da3636; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; }
        p { color: #666; line-height: 1.6; }
        .links { margin-top: 30px; }
        .btn {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover { background: #0052a3; }
        ul { list-style: none; padding: 0; margin: 20px 0; }
        li { margin: 10px 0; }
        li a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Page Missing or Moved</h2>
        <p>We couldn't find the page you requested. If you typed the URL, please check your spelling.</p>
        
        <!-- Provide clear, manual HTML alternatives since we aren't using JS to guess -->
        <div class="links">
            <p><strong>Looking for one of these?</strong></p>
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Page</a></li>
            </ul>
            <br>
            <a href="index.html" class="btn">Go straight to Homepage</a>
        </div>
        
        <p style="font-size: 0.85rem; color: #999; margin-top: 40px;">
            You will be automatically redirected to the homepage in a few moments.
        </p>
    </div>

</body>
</html>
