<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | {{ web.site_name }}</title>
    <meta name="description" content="{{ desc }}">
    <link rel="canonical" href="{{ url }}">
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; }
        nav { background: #333; padding: 1rem; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        main { padding: 2rem; max-width: 800px; margin: auto; }
        footer { background: #f4f4f4; text-align: center; padding: 1rem; position: fixed; width: 100%; bottom: 0; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="pillar.html">Main Pillar Hub</a>
    </nav>
    <main>
<div><strong>[Title]:</strong>{{ title }}</div>
<div><strong>[Sitename]:</strong>{{ web.site_name }}</div>
<div><strong>[Description]:</strong>{{ desc }}</div>
<div><strong>[Canonical]:</strong>{{ url }}</div>
        
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 My Static Site</p>
    </footer>
</body>
</html>
