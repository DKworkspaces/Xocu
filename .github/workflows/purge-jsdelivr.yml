name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main  # Triggers the purge only when code is pushed to the main branch
    paths:
      - 'js/mgr/**'   # Triggers only if a JS file changes
      - 'css/mgr/**'  # Triggers only if a CSS file changes

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Flush jsDelivr Assets
        run: |
          # Automatically extracts 'username/repo' from GitHub environment
          REPO_SLUG="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          
          BRANCH="main" 
          # Define your specific folder paths here
          JS_FOLDER="js/mgr"
          CSS_FOLDER="css/mgr"

          # Loop through each target folder
          for FOLDER in "$JS_FOLDER" "$CSS_FOLDER"; do
            if [ -d "$FOLDER" ]; then
              echo "Scanning folder: $FOLDER..."
              
              # Find files recursively inside the current folder
              find "$FOLDER" -type f \( -name "*.js" -o -name "*.css" \) | while read -r filepath; do
                
                # Keeps the folder name and its subfolders exactly as they are
                # Example: 'src/js/components/app.js' stays 'src/js/components/app.js'
                PURGE_URL="https://jsdelivr.net{REPO_SLUG}@${BRANCH}/${filepath}"
                
                echo "Purging: $PURGE_URL"
                curl -s -o /dev/null -w "Status: %{http_code}\n" "$PURGE_URL"
              done
            else
              echo "Warning: Directory $FOLDER does not exist, skipping."
            fi
          done
          
          echo -e "\nAll cache purge requests processed!"

          


          
          
