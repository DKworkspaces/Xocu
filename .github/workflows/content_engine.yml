name: Zero-to-One Content Research Engine

on:
  push:
    paths:
      - 'query.txt'

jobs:
  run_research_agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Cloud Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Web Scraper Research Agent
        run: |
          python free_growth_engine.py

      - name: Commit Report Results to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add research_reports/
          git commit -m "Automated Research Agent: New campaign report added" || echo "No changes found to commit"
          git push
