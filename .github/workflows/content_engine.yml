name: Zero-to-One Content Prompt Engine

# Trigger only when query.txt is modified and committed
on:
  push:
    paths:
      - 'query.txt'

jobs:
  build_ai_prompt:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the workflow to commit the new campaign file back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch Trends & Build Prompt File
        run: |
          python free_growth_engine.py

      # Automatically saves, commits, and pushes the new campaign file back to your repository
      - name: Commit & Push Generated Campaign
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add campaigns/
          git commit -m "Auto-generated social media prompt campaign" || echo "No changes to commit"
          git push
          
