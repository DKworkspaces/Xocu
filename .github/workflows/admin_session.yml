name: Start 4-Hour Admin Session

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Session log level'
        required: false
        default: 'info'
  push:
    branches:
      - Db  # 👈 This tells GitHub explicitly that the 'main' branch owns this workflow!

permissions:
  contents: write

jobs:
  run-admin-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install uvicorn

      - name: Install and Configure Ngrok
        run: |
                # 1. Update the certificate authorities to prevent download drops
                sudo apt-get update && sudo apt-get install -y ca-certificates curl gnupg
                
                # 2. Safely download and store the ngrok repository signature key
                sudo mkdir -p /etc/apt/keyrings
                curl -fsSL https://amazonaws.com | sudo gpg --dearmor -o /etc/apt/keyrings/ngrok.gpg --yes
                
                # 3. Add the ngrok package channel to apt sources using the saved key reference
                echo "deb [signed-by=/etc/apt/keyrings/ngrok.gpg] https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
                
                # 4. Update the package database and download the ngrok binary engine
                sudo apt-get update && sudo apt-get install -y ngrok
                
                # 5. Connect your free validation credentials
                ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start FastAPI Backend in Background
        run: |
          cd backend
          uvicorn main:app --host 127.0.0.1 --port 8000 &
        
      - name: Start Ngrok Tunnel & Display Public URL
        run: |
          ngrok http 8000 --log=stdout > ngrok.log &
          sleep 5
          export PUBLIC_URL=$(curl -s http://127.0.0 | jq -r '.tunnels.public_url')
          echo "=========================================================="
          echo "YOUR LIVE ADMIN BACKEND URL IS:"
          echo "$PUBLIC_URL"
          echo "=========================================================="

      - name: Keep Server Active for 4 Hours
        run: |
          echo "Server is now live. System accepting data logs..."
          sleep 14400  # 14400 seconds = 4 hours
          
      - name: Auto-Save SQLite Database to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage the runtime database file containing any actions
          git add backend/form_data.db || true
          
          # Commit and push changes back into your GitHub files
          git commit -m "chore: auto-saved session administrative database [skip ci]" || echo "No changes recorded."
          git push
