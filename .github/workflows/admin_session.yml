name: Start 4-Hour Admin Session

on:
  workflow_dispatch: # Allows manual click-to-run execution on GitHub

permissions:
  contents: write # Crucial: Allows GitHub Actions to save the DB back to your repo

jobs:
  run-admin-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install uvicorn

      - name: Install and Configure Ngrok
        run: |
          curl -s https://amazonaws.com | sudo gpg --dearmor -o /usr/share/keyrings/ngrok.gpg
          echo "deb [signed-by=/usr/share/keyrings/ngrok.gpg] https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start FastAPI Backend in Background
        run: |
          cd backend
          uvicorn main:app --host 127.0.0.1 --port 8000 &
        
      - name: Start Ngrok Tunnel & Display Public URL
        run: |
          ngrok http 8000 --log=stdout > ngrok.log &
          sleep 5
          export PUBLIC_URL=$(curl -s http://127.0.0 | jq -r '.tunnels.public_url')
          echo "=========================================================="
          echo "YOUR LIVE ADMIN BACKEND URL IS:"
          echo "$PUBLIC_URL"
          echo "=========================================================="

      - name: Keep Server Active for 4 Hours
        run: |
          echo "Server is now live. System accepting data logs..."
          sleep 14400  # 14400 seconds = 4 hours
          
      - name: Auto-Save SQLite Database to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage the runtime database file containing any actions
          git add backend/form_data.db || true
          
          # Commit and push changes back into your GitHub files
          git commit -m "chore: auto-saved session administrative database [skip ci]" || echo "No changes recorded."
          git push
