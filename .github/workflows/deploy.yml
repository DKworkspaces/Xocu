name: Build and Deploy Static Architecture

on:
  push:
    branches:
      - main

# Grant required permissions to compile and update GitHub Pages nodes
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping operations by canceling incomplete active runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: https://github.io
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Jinja2

    - name: Execute Modular Build Compilation Engine
      run: python build.py

    - name: Upload Clean Public Production Package
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

    - name: Host Live Build on GitHub Pages Nodes
      id: deployment
      uses: actions/deploy-pages@v4
