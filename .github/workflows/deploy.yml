name: Build and Deploy Static Architecture

on:
  push:
    branches:
      - main

# Grant required permissions to compile and update GitHub Pages nodes
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent overlapping operations by canceling incomplete active runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: https://github.io
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v5

    - name: Configure Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Jinja2

    - name: Execute Modular Build Compilation Engine
      run: python build.py
      
    # NEW: Safely commit and save the '.dist' folder back to your current branch
    - name: Commit and Push '.dist' Folder to Branch
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated Build: Updated .dist folder architecture"
        file_pattern: '.dist/*' # Restricts the commit changes solely to the .dist folder
        # Optional: Add `branch: your-branch-name` here if you want to push to a separate branch

    # UPDATED: Point the Pages uploader to the newly committed '.dist' directory
    - name: Upload Clean Public Production Package
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist' 

    - name: Host Live Build on GitHub Pages Nodes
      id: deployment
      uses: actions/deploy-pages@v4
