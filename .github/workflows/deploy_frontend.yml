name: Deploy Frontend Pages to GitHub Pages

on:
  push:
    branches:
      - Db
    paths:
      - 'frontend/**' # Triggers only when changes are made inside the frontend folder
  workflow_dispatch: # Allows you to trigger this deployment manually if needed

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-static-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Frontend Folder as Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Tells GitHub Actions to deploy only the contents of your frontend directory
          path: './frontend'

      - name: Deploy to GitHub Pages Live Link
        id: deployment
        uses: actions/deploy-pages@v4
