
name: Open-Source Code Enhancer (Zero-API)

on:
  push:
    paths:
      - 'src/**' # Instantly triggers when you add or change files inside the src/ directory

jobs:
  enhance_code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Install Local Ollama Runner Binary
      run: |
        # Download and run the official Linux installer background runner script natively
        curl -fsSL https://ollama.com | sh

    - name: Pre-Pull Lightweight Coding Model
      run: |
        # Start Ollama service daemon in the background safely
        ollama serve &
        # Wait for the service endpoint to wake up completely
        sleep 5
        # Pull the hyper-optimized 1.5 Billion parameters coding model
        ollama pull qwen2.5-coder:1.5b-instruct

    - name: Run AI Code Enhancement Agent
      run: |
        python enhancer.py

    - name: Commit & Push Enhanced Assets to Production Folder
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "✨ Refactor: Code structural optimization completed by local open-source AI"
        file_pattern: 'dist/*'
        
