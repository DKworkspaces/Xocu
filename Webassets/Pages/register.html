<body class="page-auth">
  <form class="mod-auth" method="POST" action="/api/register">
    <header class="mod-auth__header">
      <h1>Provision Account</h1>
      <p>Initialize a new operator profile node.</p>
    </header>
    
    <div class="mod-auth__field">
      <label for="name">Operator Identification</label>
      <input type="text" id="name" name="name" required placeholder="A. Vance">
    </div>

    <div class="mod-auth__field">
      <label for="email">Node Address</label>
      <input type="email" id="email" name="email" required placeholder="operator@domain.local">
    </div>
    
    <div class="mod-auth__field">
      <label for="pass">Configure Passkey</label>
      <input type="password" id="pass" name="password" minlength="8" required>
    </div>
    
    <button type="submit" class="mod-auth__submit">Generate Security Credentials</button>
    <p class="mod-auth__footer">Linked node active? <a href="login.html">Access terminal</a></p>
  </form>
</body>
