
  <!-- Tiny inline blocking script to prevent the modern Dark/Light theme flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || 'system';
      const isDark = saved === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : (saved === 'system' ? 'light' : saved));
    })();
  </script>
