<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Core Administrative Panel</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f8f9fa; }
        .panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        .nav-link { display: inline-block; padding: 12px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .nav-link:hover { background: #218838; }
        .logout-btn { padding: 12px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>🔒 Security Console Root</h1>
        <p>Your session communication layer is fully configured. Data syncing is managed by GitHub automation engines.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- Navigate across static pages safely -->
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <a href="database_view.html" class="nav-link">📊 View Database Entries</a>
            <a href="add_user.html" class="nav-link" style="background: #007bff;">➕ Add New Admin Record</a>
        </div>
        <button onclick="logout()" class="logout-btn">Terminate Session</button>
        <!-- Insert this layout snippet inside your dashboard panel controls -->
<button onclick="saveAndExit()" style="background: #fd7e14; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 10px;">
    💾 Save & Exit Server
</button>      
    </div>

    <script>
        // Security Interceptor Rule across files
        const backendUrl = localStorage.getItem('ADMIN_BACKEND_URL');
        const token = localStorage.getItem('SESSION_TOKEN');
        
        if (!backendUrl || !token) {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

    async function saveAndExit() {
        if (!confirm("Are you sure you want to save all changes and turn off the admin server? This will take the database offline instantly.")) {
            return;
        }

        const backendUrl = localStorage.getItem('ADMIN_BACKEND_URL');
        
        try {
            const response = await fetch(`${backendUrl}/exit-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const data = await response.json();

            if (response.ok) {
                alert("Database state committed! The server is now shutting down safely.");
                localStorage.clear(); // Wipe browser access session tokens
                window.location.href = "index.html"; // Move back to gateway page
            } else {
                alert("Failed to communicate exit routine validation protocol.");
            }
        } catch (err) {
            alert("Connection error or server already offline.");
        }
    }
    </script>
</body>
</html>
