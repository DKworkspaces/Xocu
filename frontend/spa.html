<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="global.css">
</head><body>
<div class="sidebar"><h2>CMS Dashboard</h2>
<nav id="main-navigation">
<a href="#home" class="nav-item">Blog Post</a>
<a href="#topic" class="nav-item">Topic</a>
<a href="#category" class="nav-item">Category</a>
<a href="#tag" class="nav-item">Tag</a>
</nav></div>

<div class="main-content">
<section id="view-home" class="spa-view" data-title="CMS Panel"><h2>Home Workspace</h2></section>
<section id="view-topic" class="spa-view" data-title="Topics Directory — CMS Panel"><h2>Topic Workspace</h2></section>
<section id="view-category" class="spa-view" data-title="Categories Directory — CMS Panel"><h2>Category Workspace</h2></section>
<section id="view-tag" class="spa-view" data-title="Tags Directory — CMS Panel"><h2>Tag Workspace</h2></section>
</div>


    <script>
        const navItems = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.spa-view');
        function navigateTo(hashTarget) {
            const cleanedHash = hashTarget.replace('#', '') || 'home';
            let viewFound = false;
// 1. Manage Active Class across permanent HTML views
            views.forEach(view => {
                if (view.id === `view-${cleanedHash}`) {
                    view.classList.add('active');
                    document.title = view.getAttribute('data-title') || 'CMS Dashboard';
                    viewFound = true;
                } else {
                    view.classList.remove('active');
                }
            });
// Fallback route context logic if page matching signature fails
            if (!viewFound) {
                const homeView = document.getElementById('view-home');
                if (homeView) {
                    homeView.classList.add('active');
                    document.title = homeView.getAttribute('data-title');
                }
            }
// 2. Synchronize navigation links highlighting indicator classes
            navItems.forEach(item => {
                const itemHash = item.getAttribute('href');
                if (itemHash === `#${cleanedHash}` || (cleanedHash === 'home' && itemHash === '#home')) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
// 3. Event Listeners for explicit navigational link actions
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const targetHash = item.getAttribute('href');
                navigateTo(targetHash);
            });
        });
// 4. Initial Routing Initialization Setup
        if (window.location.hash) {
            navigateTo(window.location.hash);
        } else {
            navigateTo('#home');
        }
// Optional: Listen to browser history arrow transitions natively
        window.addEventListener('hashchange', () => {
            navigateTo(window.location.hash);
        });
  </script>
  
<!-- 
  <script src="/global.js"></script>
  -->
</body></html>
