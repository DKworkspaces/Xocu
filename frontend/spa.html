<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link rel="stylesheet" href="global.css">
</head><body>
<div class="sidebar"><h2>CMS Dashboard</h2>
<nav id="main-navigation">
<a href="#home" class="nav-item">Blog Post</a>
<a href="#topic" class="nav-item">Topic</a>
<a href="#category" class="nav-item">Category</a>
<a href="#tag" class="nav-item">Tag</a>
</nav></div>

<div class="main-content">
<section id="view-home" class="spa-view" data-title="CMS Panel"><h2>Home Workspace</h2>

<div class="data-table-container"><div class="data-table-header-box">
    <h3>Existing Blog Posts</h3>
    <a href="/create-post" class="btn-create-new" onclick="event.preventDefault(); alert('Redirecting to post creation page workflow...');">Create New Post</a>
    </div>
        <table><thead><tr id="table-headers">
<!-- Populated dynamically via script execution -->
        </tr></thead>
        <tbody id="table-body-posts">
<!-- API elements map directly inside here -->
        </tbody></table></div>

</section>
<section id="view-topic" class="spa-view" data-title="Topics Directory — CMS Panel"><h2>Topic Workspace</h2></section>
<section id="view-category" class="spa-view" data-title="Categories Directory — CMS Panel"><h2>Category Workspace</h2></section>
<section id="view-tag" class="spa-view" data-title="Tags Directory — CMS Panel"><h2>Tag Workspace</h2></section>
</div>


    <script>
        const navItems = document.querySelectorAll('.nav-item');
        const views = document.querySelectorAll('.spa-view');
        function navigateTo(hashTarget) {
            const cleanedHash = hashTarget.replace('#', '') || 'home';
            let viewFound = false;
// 1. Manage Active Class across permanent HTML views
            views.forEach(view => {
                if (view.id === `view-${cleanedHash}`) {
                    view.classList.add('active');
                    document.title = view.getAttribute('data-title') || 'CMS Dashboard';
                    viewFound = true;
                } else {
                    view.classList.remove('active');
                }
            });
// Fallback route context logic if page matching signature fails
            if (!viewFound) {
                const homeView = document.getElementById('view-home');
                if (homeView) {
                    homeView.classList.add('active');
                    document.title = homeView.getAttribute('data-title');
                }
            }
// 2. Synchronize navigation links highlighting indicator classes
            navItems.forEach(item => {
                const itemHash = item.getAttribute('href');
                if (itemHash === `#${cleanedHash}` || (cleanedHash === 'home' && itemHash === '#home')) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
// 3. Event Listeners for explicit navigational link actions
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const targetHash = item.getAttribute('href');
                navigateTo(targetHash);
            });
        });
// 4. Initial Routing Initialization Setup
        if (window.location.hash) {
            navigateTo(window.location.hash);
        } else {
            navigateTo('#home');
        }
// Optional: Listen to browser history arrow transitions natively
        window.addEventListener('hashchange', () => {
            navigateTo(window.location.hash);
        });



// Base configuration targeting a real public testing API endpoint
const API_BASE_URL = 'https://typicode.com';
// A. Core Function: Asynchronously Fetch Data From Your Server API
async function fetchBlogPosts() {
    const tbody = document.getElementById('table-body-posts');
    const headerRow = document.getElementById('table-headers');
    tbody.innerHTML = `<tr><td colspan="3" class="table-empty-state">Loading latest records...</td></tr>`;
    const columns = [{ name: "Post Title" }, { name: "Slug Pathway" }, { name: "Control Actions" }];
    headerRow.innerHTML = columns.map(col => `<th>${col.name}</th>`).join('');
    try {
        const response = await fetch(API_BASE_URL);
        if (!response.ok) {throw new Error(`HTTP network error code returned: ${response.status}`);}
        const postsData = await response.json();
        renderTableRows(postsData);
    } catch (error) {
        console.error("API Fetch Exception:", error);
        tbody.innerHTML = `<tr>
            <td colspan="3" class="table-empty-state" style="color:red;">
            <strong>Failed to Load Content</strong>
            <p>${error.message}. Please check your connection or endpoint configurations.</p>
            </td></tr>`;
    }
}
// B. Structural Rendering Loop
function renderTableRows(posts) {
    const tbody = document.getElementById('table-body-posts');
    if (posts && posts.length > 0) {
        tbody.innerHTML = posts.map(post => {
            return`<tr id="post-row-${post.id}">
                    <td><strong>${post.title}</strong></td>
                    <td><code>${post.id}</code></td>
                    <td class="actions">
                        <a href="/edit-post/${post.id}" class="btn-edit" onclick="handleEditAction(event, ${post.id})">Edit</a>
                        <form action="/delete-post/${post.id}" method="POST" class="delete-form" onsubmit="return handleDeleteAction(event, ${post.id});">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
        </td></tr>`;}).join('');
    } else {
        tbody.innerHTML = `<tr><td colspan="3" class="table-empty-state"><p>No Entries found on network database.</p></td></tr>`;
    }
}
// C. Functional Action Utilities (Connecting HTTP requests back out to your server)
function handleEditAction(event, id) {
    event.preventDefault();
    alert(`Trigger internal SPA layout window change routing context targeting Edit Mode for ID: ${id}`);
}

async function handleDeleteAction(event, id) {
    event.preventDefault();
    if (!confirm('Are you absolutely sure you want to delete this record permanently?')) {return false;}
    try {
        const response = await fetch(`https://typicode.com{id}`, {method: 'DELETE'});
        if (response.ok) {
            const targetRow = document.getElementById(`post-row-${id}`);
            if (targetRow) {
                targetRow.style.transition = 'opacity 0.25s ease';
                targetRow.style.opacity = '0';
                setTimeout(() => targetRow.remove(), 250);
            }
            alert(`Record #${id} successfully dropped from remote server instance.`);
        } else {alert('Server rejected the delete operational sequence script logic parameters.');}
    } catch (err) {alert(`Network connection failure caught during deletion: ${err.message}`);}
}
                        
            
  </script>
