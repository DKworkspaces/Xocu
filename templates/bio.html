<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} | Links</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 40px 20px; }
        img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #38bdf8; }
        h1 { font-size: 1.3rem; margin: 15px 0 5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        .btn { display: block; background: #1e293b; color: #f8fafc; text-decoration: none; padding: 14px; border-radius: 8px; margin: 12px auto; max-width: 320px; font-weight: bold; border: 1px solid #334155; transition: 0.2s; }
        .btn:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <img src="{{ profile_pic }}" alt="{{ name }}">
    <h1>{{ name }}</h1>
    <p>{{ bio_text }}</p>
    
    {% for link in links %}
    <a class="btn" href="{{ link.url }}" target="_blank">{{ link.title }}</a>
    {% endfor %}
</body>
</html>
